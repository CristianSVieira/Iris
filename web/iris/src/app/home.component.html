<main class="main">
    <div class="header">
        <div class="logo"></div>
        <a href="#categories"><button id="toggle-button" class="logotipo" aria-controls="categories" (click)="handleClick($event)" #toggleButton>IRIS</button></a>
        <div class="header__controls">

            <div class="search">
                <input id="search_bar" type="text" placeholder="Pesquisa">
                <button id="search_button">🔍</button>
            </div>
        </div>
    </div>

    <div id="categories" #categories>
        <div class="header">
            <div class="logo"></div>
            <a href="#categories"><button id="untoggle-button" class="logotipo" aria-controls="categories" (click)="handleClick($event)" #untoggleButton>IRIS</button></a>
        </div>
        
        <div id="categories_container" tabindex="-1" #categoriesContainer>
            
            <div class="category" style="background-color: #FFA500;" #category><span>Eletrônicos</span></div>
            <div class="category" style="background-color: #FF4500;" #category><span>Automotores</span></div>
            <div class="category" style="background-color: #C71585;" #category><span>Moda</span></div>
            <div class="category" style="background-color: #800080;" #category><span>Musicais</span></div>
            <div class="category" style="background-color: #00BFFF;" #category><span>Esportivos</span></div>
        </div>
    </div>
    
    <div class="produtos">
        <h1>PRODUTO</h1>
    </div>
</main>

<router-outlet></router-outlet>
